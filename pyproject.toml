[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "notebooks",
    "gx",
    ".dvc",
    ".venv",
    "venv",
    "scripts",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.isort]
known-first-party = [
    "olist_ml",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
